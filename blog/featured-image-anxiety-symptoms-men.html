<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पुरुषों में चिंता के लक्षण - Premium Featured Image</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Devanagari', sans-serif;
            background: #1A1A1A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .featured-image {
            width: 1200px;
            height: 675px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #FAF7F2 0%, #F5F0E8 50%, #E8DCCB 100%);
            border-radius: 16px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
        }

        /* Abstract curved shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #C8A96B 0%, #D4B87A 100%);
            top: -100px;
            right: 100px;
            opacity: 0.3;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #E8DCCB 0%, #D4C9B5 100%);
            bottom: -50px;
            left: 200px;
            opacity: 0.5;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #C8A96B 0%, #BFA05F 100%);
            top: 200px;
            right: 350px;
            opacity: 0.2;
        }

        .shape-4 {
            width: 150px;
            height: 150px;
            background: #C8A96B;
            bottom: 150px;
            right: 150px;
            opacity: 0.15;
        }

        /* Curved wave at bottom */
        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: calc(100% + 100px);
            height: 200px;
            background: linear-gradient(180deg, transparent 0%, rgba(200, 169, 107, 0.1) 100%);
            border-radius: 50% 50% 0 0;
        }

        .wave-2 {
            bottom: -80px;
            height: 180px;
            background: linear-gradient(180deg, transparent 0%, rgba(232, 220, 203, 0.15) 100%);
            width: calc(100% + 150px);
            left: -75px;
        }

        /* Content layout */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            height: 100%;
            padding: 50px 60px;
        }

        /* Left side - Text content */
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 520px;
        }

        .headline {
            font-size: 72px;
            font-weight: 900;
            line-height: 1.1;
            color: #1A1A1A;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .headline .highlight {
            color: #C8A96B;
            display: block;
        }

        .subheadline {
            font-size: 26px;
            font-weight: 500;
            color: #4A4A4A;
            line-height: 1.4;
            margin-bottom: 32px;
            padding-left: 4px;
            border-left: 4px solid #C8A96B;
            padding-left: 20px;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
            color: #FFFFFF;
            padding: 18px 36px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 600;
            width: fit-content;
            box-shadow: 0 8px 30px rgba(26, 26, 26, 0.3);
            transition: all 0.3s ease;
        }

        .cta-button .arrow {
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover .arrow {
            transform: translateX(5px);
        }

        /* Right side - Doctor visual */
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .doctor-container {
            position: relative;
            width: 380px;
            height: 480px;
        }

        .doctor-frame {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(200, 169, 107, 0.2) 0%, rgba(232, 220, 203, 0.4) 100%);
            border: 2px solid rgba(200, 169, 107, 0.3);
        }

        .doctor-silhouette {
            position: absolute;
            inset: 20px;
            border-radius: 20px;
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F0E8 100%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .doctor-silhouette::before {
            content: '';
            position: absolute;
            top: 30px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #E8DCCB 0%, #D4C9B5 100%);
        }

        /* Doctor icon using SVG */
        .doctor-icon {
            position: absolute;
            bottom: 40px;
            width: 200px;
            height: 200px;
        }

        /* Floating medical elements */
        .floating-element {
            position: absolute;
            z-index: 20;
        }

        .plus-icon {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .plus-icon::before,
        .plus-icon::after {
            content: '';
            position: absolute;
            background: #C8A96B;
            border-radius: 4px;
        }

        .plus-icon::before {
            width: 4px;
            height: 24px;
        }

        .plus-icon::after {
            width: 24px;
            height: 4px;
        }

        .plus-1 {
            top: 80px;
            right: 280px;
            animation: float 3s ease-in-out infinite;
        }

        .plus-2 {
            bottom: 200px;
            right: 220px;
            animation: float 3.5s ease-in-out infinite 0.5s;
        }

        .plus-3 {
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            animation: float 4s ease-in-out infinite 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Geometric accents */
        .circle-accent {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(200, 169, 107, 0.4);
            background: transparent;
        }

        .circle-1 {
            width: 80px;
            height: 80px;
            top: 60px;
            left: 40px;
            animation: pulse 4s ease-in-out infinite;
        }

        .circle-2 {
            width: 50px;
            height: 50px;
            bottom: 120px;
            left: 80px;
            animation: pulse 4s ease-in-out infinite 1s;
        }

        .circle-3 {
            width: 30px;
            height: 30px;
            top: 200px;
            left: 100px;
            background: rgba(200, 169, 107, 0.1);
            animation: pulse 4s ease-in-out infinite 2s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Soft glow effect */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 169, 107, 0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Premium badge */
        .badge {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(26, 26, 26, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            color: #C8A96B;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 30;
        }

        .badge svg {
            width: 20px;
            height: 20px;
        }

        /* Logo area */
        .logo-area {
            position: absolute;
            bottom: 30px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 30;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #1A1A1A;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="featured-image">
        <!-- Abstract background shapes -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>

        <!-- Curved wave -->
        <div class="wave-container">
            <div class="wave"></div>
            <div class="wave wave-2"></div>
        </div>

        <!-- Geometric accents -->
        <div class="circle-accent circle-1"></div>
        <div class="circle-accent circle-2"></div>
        <div class="circle-accent circle-3"></div>

        <!-- Floating medical plus icons -->
        <div class="floating-element plus-icon plus-1"></div>
        <div class="floating-element plus-icon plus-2"></div>
        <div class="floating-element plus-icon plus-3"></div>

        <!-- Premium badge -->
        <div class="badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            <span>Raj Hospital</span>
        </div>

        <!-- Main content -->
        <div class="content-wrapper">
            <!-- Left side - Text -->
            <div class="text-content">
                <h1 class="headline">
                    पुरुषों में
                    <span class="highlight">चिंता के लक्षण</span>
                </h1>
                <p class="subheadline">
                    तनाव और मानसिक स्वास्थ्य समस्याओं के सामान्य संकेत
                </p>
                <div class="cta-button">
                    <span>पूरा लेख पढ़ें</span>
                    <span class="arrow">→</span>
                </div>
            </div>

            <!-- Right side - Visual -->
            <div class="visual-content">
                <div class="glow"></div>
                <div class="doctor-container">
                    <div class="doctor-frame"></div>
                    <div class="doctor-silhouette">
                        <!-- Doctor/Patient professional illustration -->
                        <svg class="doctor-icon" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Background circle -->
                            <circle cx="100" cy="100" r="95" fill="url(#grad1)" />
                            <!-- Person silhouette -->
                            <ellipse cx="100" cy="65" rx="35" ry="40" fill="#4A4A4A"/>
                            <!-- Shoulders/body -->
                            <path d="M40 180 Q40 130 100 130 Q160 130 160 180" fill="#1A1A1A"/>
                            <!-- Stethoscope -->
                            <path d="M70 140 Q60 160 80 175" stroke="#C8A96B" stroke-width="4" fill="none"/>
                            <circle cx="80" cy="178" r="8" fill="#C8A96B"/>
                            <path d="M130 140 Q140 160 120 175" stroke="#C8A96B" stroke-width="4" fill="none"/>
                            <!-- Medical cross on chest -->
                            <rect x="90" y="145" width="20" height="6" rx="2" fill="#FFFFFF"/>
                            <rect x="97" y="138" width="6" height="20" rx="2" fill="#FFFFFF"/>
                            <defs>
                                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#E8DCCB"/>
                                    <stop offset="100%" stop-color="#D4C9B5"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Logo area -->
        <div class="logo-area">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="#C8A96B">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                </svg>
            </div>
            <span class="logo-text">RAJ HOSPITAL</span>
        </div>
    </div>
</body>
</html>
